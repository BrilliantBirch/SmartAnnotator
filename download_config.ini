# VAI_E_SmartAnnotator 在线安装器下载配置
#
# 本文件记录 Gitee Release 上 CPU/GPU 安装包的下载地址。
# build.py 编译在线安装器时自动读取此文件，通过 /D 参数传递给 ISCC。
#
# Gitee 仓库: https://gitee.com/baibinnan/vai_-e_-smart-annotator
#
# 分卷机制:
#   - Gitee Release 单文件限制 100 MB，GPU 版 zip 超过此限制时自动分卷
#   - parts = 1: url 为完整文件 URL，直接下载
#   - parts > 1: url 为基础 URL（以 .part 结尾），追加 001/002/... 下载各分卷后合并
#   - 分卷文件名: VAI_E_SmartAnnotator_GPU_1.2.0.zip.part001, .part002, ...
#
# 上传步骤:
#   1. 运行 `python build.py --mode all` 生成 build/packages/ 下的 zip 或分卷文件
#   2. 在 Gitee 仓库 → 发行版 → 新建发行版
#   3. 上传 build/packages/ 下的所有文件（CPU: 1 个 zip, GPU: 多个 .partXXX 文件）
#   4. 发布发行版
#   5. 运行 `python build.py --mode online` 重新编译在线安装器（自动读取本文件）
#
# URL 格式:
#   https://gitee.com/{account}/{repo}/releases/download/{version}/{filename}

[urls]
cpu_url = https://gitee.com/baibinnan/vai_-e_-smart-annotator/releases/download/1.2.0_cpu/VAI_E_SmartAnnotator_CPU_1.2.0.zip
cpu_parts = 1
gpu_url = https://gitee.com/baibinnan/vai_-e_-smart-annotator/releases/download/1.2.0_gpu/VAI_E_SmartAnnotator_GPU_1.2.0.zip.part
gpu_parts = 6

[info]
version = 1.2.0
cpu_size_mb = 94
gpu_size_mb = 549
