# VAI_E_SmartAnnotator 在线安装器下载配置
#
# 本文件记录 Gitee Release 上 CPU/GPU 安装包的下载地址。
# build.py 编译在线安装器时自动读取此文件，通过 /D 参数传递给 ISCC。
#
# Gitee 仓库: https://gitee.com/baibinnan/vai_-e_-smart-annotator
#
# 上传步骤:
#   1. 运行 `python build.py --mode all` 生成 build/packages/ 目录下的 zip 文件
#   2. 在 Gitee 仓库页面 → 发行版 → 新建发行版
#   3. 上传 build/packages/VAI_E_SmartAnnotator_CPU_1.2.0.zip 和 VAI_E_SmartAnnotator_GPU_1.2.0.zip
#   4. 发布发行版
#   5. 运行 `python build.py --mode online` 重新编译在线安装器（自动读取本文件 URL）
#
# URL 格式:
#   https://gitee.com/{account}/{repo}/releases/download/{version}/{filename}

[urls]
cpu_url = https://gitee.com/baibinnan/vai_-e_-smart-annotator/releases/download/v1.2.0/VAI_E_SmartAnnotator_CPU_1.2.0.zip
gpu_url = https://gitee.com/baibinnan/vai_-e_-smart-annotator/releases/download/v1.2.0/VAI_E_SmartAnnotator_GPU_1.2.0.zip

[info]
version = 1.2.0
cpu_size_mb = 94
gpu_size_mb = 250
